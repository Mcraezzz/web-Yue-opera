spring.application.name=backend-spring
server.port=${SPRING_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:web_yueju}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

yueju.ai.api-base=${VOLCENGINE_API_BASE:https://ark.cn-beijing.volces.com/api/v3}
yueju.ai.api-key=${VOLCENGINE_API_KEY:}
yueju.ai.chat-model=${CHAT_MODEL:doubao-seed-2-0-lite-260428}
yueju.ai.vision-model=${VISION_MODEL:${CHAT_MODEL:doubao-seed-2-0-lite-260428}}
yueju.ai.image-model=${IMAGE_MODEL:doubao-seedream-5-0-260128}
yueju.ai.thinking-type=${AI_THINKING_TYPE:disabled}
yueju.ai.chat-max-output-tokens=${CHAT_MAX_OUTPUT_TOKENS:450}
yueju.ai.chat-timeout-seconds=${CHAT_TIMEOUT_SECONDS:90}
yueju.ai.vision-timeout-seconds=${VISION_TIMEOUT_SECONDS:240}
yueju.ai.chat-cache-seconds=${CHAT_CACHE_SECONDS:600}
yueju.ai.image-storage-dir=${AI_IMAGE_STORAGE_DIR:generated-ai-images}
yueju.rag.enabled=${RAG_ENABLED:true}
yueju.rag.service-url=${RAG_SERVICE_URL:http://127.0.0.1:8091}
yueju.rag.timeout-seconds=${RAG_TIMEOUT_SECONDS:45}
yueju.rag.search-max-wait-ms=${RAG_SEARCH_MAX_WAIT_MS:600}
yueju.media.analysis-file=${MEDIA_ANALYSIS_FILE:../data/media-analyses.json}
yueju.media.analysis-script=${MEDIA_ANALYSIS_SCRIPT:../scripts/generate-media-analysis.py}
yueju.media.python=${MEDIA_ANALYSIS_PYTHON:python}
yueju.media.default-input=${MEDIA_ANALYSIS_INPUT:C:/Users/22672/Downloads/梁山伯与祝英台(吴凤花.陈飞).mp4}
